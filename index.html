<style>

1.5px solid var(--line);border-radius:9px;padding:10px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:18px 0}.tile{display:block;text-align:left;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:13px;padding:17px;min-height:148px}.tile:hover{border-color:var(--blue)}.tile h3{margin:.4em 0}.pill{font-size:.73rem;font-weight:750;border-radius:7px;background:var(--pale);color:var(--blue);padding:3px 8px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0}.step{font-size:.78rem;text-align:center;border:1px solid var(--line);border-radius:8px;padding:7px 4px}.step.now{background:var(--pale);border-color:var(--blue);font-weight:750}.step.done{border-color:var(--good);color:var(--good)}.q{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:19px;margin:13px 0}.qtitle{font-weight:650;font-size:1.08rem;margin:9px 0}.opt{display:block;width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:11px;padding:11px 13px;text-align:left;margin:8px 0}.opt[aria-pressed=true]{border-color:var(--blue);background:var(--pale)}.opt:disabled{cursor:default}.feedback{border-left:4px solid var(--warn);background:var(--warnp);border-radius:8px;padding:12px 15px;margin:12px 0}.feedback.correct{background:var(--goodp);border-color:var(--good)}.feedback.wrong{background:var(--badp);border-color:var(--bad)}.progress{height:7px;background:var(--line);border-radius:10px;overflow:hidden;margin:13px 0}.bar{height:100%;background:var(--blue);transition:width .2s}.score{font:700 3rem var(--serif)}.level{font-size:.8rem;border-radius:6px;padding:3px 7px;background:var(--pale);color:var(--blue);font-weight:700}.level.l3{background:var(--pinkp);color:var(--pink)}.review-list{list-style:none;padding:0}.review-list li{padding:12px 0;border-bottom:1px solid var(--line)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line);margin-right:6px}.dot.on{background:var(--blue)}.footnote{font-size:.82rem;color:var(--muted)}.hero{padding:14px 0}.divider{border:0;border-top:1px solid var(--line);margin:18px 0}.term{font-weight:700;color:var(--blue)}
@media(max-width:700px){.units{grid-template-columns:repeat(4,1fr)}.tiles,.tools{grid-template-columns:1fr}.steps{gap:4px}.step{font-size:.71rem;padding:5px 2px}.card{padding:16px}.topright{display:none}}
